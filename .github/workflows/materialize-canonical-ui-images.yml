name: Inspect Couranr UI image uploads

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/couranr-mvp/ui-reference/MATERIALIZE_CANONICAL_IMAGES
      - .github/workflows/materialize-canonical-ui-images.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs/platform-dependency-baseline-v1-1
          fetch-depth: 0

      - name: Collect UUID-named root PNG uploads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/couranr-root-ui-images

          find . -maxdepth 1 -type f -regextype posix-extended \
            -regex './[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\.png' \
            -print0 | sort -z | xargs -0 -I{} cp '{}' /tmp/couranr-root-ui-images/

          count=$(find /tmp/couranr-root-ui-images -type f -name '*.png' | wc -l | tr -d ' ')
          echo "Collected $count UUID-named PNG uploads"
          test "$count" -ge "62"

          find /tmp/couranr-root-ui-images -type f -name '*.png' -printf '%f\n' | sort > /tmp/couranr-root-ui-images/files.txt

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: couranr-root-ui-images
          path: /tmp/couranr-root-ui-images
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
