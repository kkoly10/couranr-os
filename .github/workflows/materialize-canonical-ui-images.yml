name: Materialize canonical Couranr UI images

on:
  push:
    branches:
      - docs/platform-dependency-baseline-v1-1
    paths:
      - docs/couranr-mvp/ui-reference/canonical-image-payload/READY

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/platform-dependency-baseline-v1-1
          fetch-depth: 0

      - name: Extract approved canonical image payload
        shell: bash
        run: |
          set -euo pipefail
          payload="docs/couranr-mvp/ui-reference/canonical-image-payload"
          destination="docs/couranr-mvp/ui-reference"
          test -f "$payload/canonical-mvp-images.tar.gz"
          tar -xzf "$payload/canonical-mvp-images.tar.gz" -C "$destination"
          count=$(find "$destination/canonical-mvp-images" -type f -name '*.webp' | wc -l | tr -d ' ')
          test "$count" = "62"

      - name: Remove one-time payload and workflow
        shell: bash
        run: |
          rm -rf docs/couranr-mvp/ui-reference/canonical-image-payload
          rm -f docs/couranr-mvp/ui-reference/.upload-status
          rm -f .github/workflows/materialize-canonical-ui-images.yml

      - name: Commit canonical MVP image set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: materialize approved canonical MVP UI images"
          git push origin HEAD:docs/platform-dependency-baseline-v1-1
