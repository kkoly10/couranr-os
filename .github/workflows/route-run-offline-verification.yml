name: Route Run offline verification workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/route-run-offline-verification.yml']
permissions:
  contents: read
concurrency:
  group: route-run-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workspace:
    if: github.head_ref == 'feat/business-route-run-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Provision verified disposable PostgREST binary
        env:
          COURANR_POSTGREST: /tmp/couranr-browser-tools/postgrest
        run: |
          set -euo pipefail
          mkdir -p /tmp/couranr-browser-tools
          node scripts/provisionPostgrest.mjs
          /tmp/couranr-browser-tools/postgrest --version > /tmp/couranr-browser-tools/version.txt
          cd /tmp/couranr-browser-tools
          sha256sum postgrest > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: couranr-browser-tools-${{ github.event.pull_request.head.sha }}
          path: /tmp/couranr-browser-tools/
          retention-days: 1
          compression-level: 6
          if-no-files-found: error
