name: Route Run offline verification workspace
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/route-run-offline-verification.yml']
permissions:
  contents: read
concurrency:
  group: route-run-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workspace:
    if: github.head_ref == 'feat/business-route-run-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deterministic development dependencies
        run: npm ci
      - name: Package tracked source and offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/couranr-offline"
          git rev-parse HEAD > "$RUNNER_TEMP/couranr-offline/revision.txt"
          git archive --format=tar HEAD | gzip -1 > "$RUNNER_TEMP/couranr-offline/source.tar.gz"
          tar -czf "$RUNNER_TEMP/couranr-offline/dependencies.tar.gz" node_modules
      - name: Package disposable PostgreSQL 17 tools
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash \
            -v "$RUNNER_TEMP/couranr-offline:/out" postgres:17-bookworm -c '
              set -euo pipefail
              mkdir -p /tmp/pg-export
              cp -a --parents /usr/lib/postgresql/17 /usr/share/postgresql/17 /tmp/pg-export/
              rm -rf /tmp/pg-export/usr/lib/postgresql/17/lib/bitcode
              rm -f /tmp/pg-export/usr/lib/postgresql/17/lib/llvmjit.so
              for file in /usr/lib/postgresql/17/bin/* /usr/lib/postgresql/17/lib/*.so; do
                case "$file" in *llvmjit*) continue ;; esac
                ldd "$file" 2>/dev/null || true
              done | grep -oE "/[^[:space:]]+" | sort -u > /tmp/pg-dependencies
              while IFS= read -r file; do
                test -f "$file" && cp -L --parents "$file" /tmp/pg-export/
              done < /tmp/pg-dependencies
              tar -C /tmp/pg-export -czf /out/postgres17.tar.gz .
            '
      - name: Record archive checksums
        shell: bash
        run: |
          cd "$RUNNER_TEMP/couranr-offline"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: couranr-offline-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/couranr-offline/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
